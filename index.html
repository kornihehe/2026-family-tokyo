<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8ee" />
    <meta name="description" content="2026黑皮東京楓葉｜2026 年 11 月 27 日至 12 月 2 日的東京、富士急互動式旅程。" />
    <meta property="og:title" content="2026黑皮東京楓葉" />
    <meta property="og:description" content="2026黑皮東京楓葉｜2026 年 11 月 27 日至 12 月 2 日的東京、富士急互動式旅程。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://travel-japan-alpha.vercel.app/" />
    <meta property="og:site_name" content="2026黑皮東京楓葉" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:image" content="https://travel-japan-alpha.vercel.app/assets/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="黑貓、富士山與紅葉的東京旅程插畫" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <title>2026黑皮東京楓葉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="itinerary-background">
    <div class="grain" aria-hidden="true"></div>
    <header class="site-header">
      <div class="day-rail">
        <div class="day-picker" id="dayPicker" role="tablist" aria-label="選擇旅程日程"></div>
      </div>
      <div class="weather-summary" id="weatherSummary" aria-live="polite"></div>
    </header>

    <main id="top">
      <section class="view-panel active" id="itineraryView" data-panel="itinerary">
        <div class="itinerary-layout section-pad">
          <div class="itinerary-toolbar">
            <button class="add-itinerary-button" id="addItineraryButton" type="button">
              <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              <span class="sr-only">新增行程</span>
            </button>
          </div>
          <div class="flight-info" id="flightInfo"></div>
          <div class="timeline" id="timeline" aria-live="polite"></div>
        </div>
      </section>

      <section class="view-panel booking-view section-pad" id="bookingView" data-panel="booking">
        <h2 class="plain-title">預定</h2>
        <div class="booking-grid" id="bookingGrid"></div>
        <div class="booking-add-wrap">
          <button class="booking-add-button" id="addBookingButton" type="button"><span aria-hidden="true">＋</span>新增預定</button>
        </div>
      </section>

      <section class="view-panel list-view section-pad" id="listView" data-panel="list">
        <h2 class="plain-title">準備</h2>
        <div class="checklist" id="checklist"></div>
      </section>
    </main>

    <dialog class="itinerary-dialog" id="itineraryDialog" aria-labelledby="itineraryDialogTitle">
      <form class="itinerary-form" id="itineraryForm">
        <div class="dialog-head">
          <div>
            <span class="dialog-kicker" id="itineraryDialogKicker">ITINERARY</span>
            <h2 id="itineraryDialogTitle">新增行程</h2>
          </div>
          <button class="dialog-close" id="closeItineraryDialog" type="button" aria-label="關閉行程視窗">
            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12"></path><path d="M18 6 6 18"></path></svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="form-field-pair">
            <label class="form-field">
              <span>日期</span>
              <select id="itineraryDate" name="trip_date" required>
                <option value="2026-11-27">11/27 · FRI</option>
                <option value="2026-11-28">11/28 · SAT</option>
                <option value="2026-11-29">11/29 · SUN</option>
                <option value="2026-11-30">11/30 · MON</option>
                <option value="2026-12-01">12/01 · TUE</option>
                <option value="2026-12-02">12/02 · WED</option>
              </select>
            </label>
            <label class="form-field">
              <span>時間</span>
              <input id="itineraryTime" name="time_label" type="text" placeholder="例如 14:30 / ALL DAY" maxlength="24" />
            </label>
          </div>
          <div class="form-field form-field-wide">
            <span id="itineraryTypeLabel">類型</span>
            <div class="itinerary-type-picker" role="radiogroup" aria-labelledby="itineraryTypeLabel">
              <button class="itinerary-type-button is-selected" type="button" role="radio" aria-checked="true" data-itinerary-type="OPEN">OPEN</button>
              <button class="itinerary-type-button" type="button" role="radio" aria-checked="false" data-itinerary-type="SPOT">SPOT</button>
              <button class="itinerary-type-button" type="button" role="radio" aria-checked="false" data-itinerary-type="FOOD">FOOD</button>
              <button class="itinerary-type-button" type="button" role="radio" aria-checked="false" data-itinerary-type="SHOP">SHOP</button>
              <button class="itinerary-type-button" type="button" role="radio" aria-checked="false" data-itinerary-type="DRIVE">DRIVE</button>
              <button class="itinerary-type-button" type="button" role="radio" aria-checked="false" data-itinerary-type="WALK">WALK</button>
            </div>
            <input id="itineraryType" name="type" type="hidden" value="OPEN" />
          </div>
          <label class="form-field form-field-wide">
            <span>標題</span>
            <input id="itineraryTitle" name="title" type="text" placeholder="例如：東京車站" maxlength="80" required />
          </label>
          <label class="form-field form-field-wide">
            <span>說明</span>
            <textarea id="itineraryDescription" name="description" rows="3" placeholder="補充集合、預約或移動資訊" maxlength="240"></textarea>
          </label>
          <label class="form-field">
            <span>地點</span>
            <input id="itineraryLocation" name="location" type="text" placeholder="例如：東京車站" maxlength="120" />
          </label>
          <label class="form-field">
            <span>備註</span>
            <input id="itineraryDetail" name="detail" type="text" placeholder="例如：預約 19:00" maxlength="120" />
          </label>
          <label class="form-field form-field-wide">
            <span>Google Maps 連結 <small>選填</small></span>
            <input id="itineraryMapUrl" name="map_url" type="url" placeholder="貼上 Google Maps 連結" maxlength="500" />
          </label>
        </div>
        <div class="dialog-actions">
          <button class="dialog-cancel" id="cancelItineraryDialog" type="button">取消</button>
          <button class="dialog-submit" id="saveItineraryButton" type="submit">儲存行程</button>
        </div>
      </form>
    </dialog>

    <dialog class="itinerary-dialog booking-dialog" id="bookingDialog" aria-labelledby="bookingDialogTitle">
      <form class="itinerary-form" id="bookingForm">
        <div class="dialog-head">
          <div>
            <span class="dialog-kicker" id="bookingDialogKicker">BOOKING</span>
            <h2 id="bookingDialogTitle">新增預定</h2>
          </div>
          <button class="dialog-close" id="closeBookingDialog" type="button" aria-label="關閉預定視窗">
            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12"></path><path d="M18 6 6 18"></path></svg>
          </button>
        </div>
        <div class="form-grid">
          <label class="form-field">
            <span>日期／期間</span>
            <input id="bookingPeriod" name="period" type="text" placeholder="例如 11/27" maxlength="24" />
          </label>
          <label class="form-field form-field-wide">
            <span>標題</span>
            <input id="bookingTitle" name="title" type="text" placeholder="例如 Highland Resort Hotel &amp; Spa" maxlength="100" required />
          </label>
          <label class="form-field form-field-wide">
            <span>路線／地址</span>
            <textarea id="bookingRoute" name="route" rows="2" placeholder="可分行輸入地址或移動資訊" maxlength="240"></textarea>
          </label>
          <label class="form-field form-field-wide">
            <span>卡片資訊 <small>每行一項</small></span>
            <textarea id="bookingMeta" name="meta" rows="3" placeholder="例如：已確認&#10;例如：不可取消" maxlength="240"></textarea>
          </label>
          <label class="form-field form-field-wide">
            <span>Google Maps 連結 <small>選填</small></span>
            <input id="bookingMapUrl" name="map_url" type="url" placeholder="貼上 Google Maps 連結" maxlength="500" />
          </label>
          <label class="form-field form-field-wide">
            <span>官網連結 <small>選填</small></span>
            <input id="bookingSiteUrl" name="site_url" type="url" placeholder="貼上官方網站連結" maxlength="500" />
          </label>
        </div>
        <div class="dialog-actions">
          <button class="dialog-cancel" id="cancelBookingDialog" type="button">取消</button>
          <button class="dialog-submit" id="saveBookingButton" type="submit">儲存預定</button>
        </div>
      </form>
    </dialog>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="bottom-nav-item active" data-view="itinerary" type="button"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>行程</button>
      <button class="bottom-nav-item" data-view="booking" type="button"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path><path d="M8 7h8"></path><path d="M8 11h8"></path><path d="M8 15h5"></path></svg>預定</button>
      <button class="bottom-nav-item" data-view="list" type="button"><svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 3 3 3-3"></path><path d="M13 6h8"></path><path d="m3 12 3 3 3-3"></path><path d="M13 12h8"></path><path d="m3 18 3 3 3-3"></path><path d="M13 18h8"></path></svg>準備</button>
    </nav>
    <div class="toast" id="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
